services:
  sandbox:
    build: .
    working_dir: /app
    volumes:
      - .:/app
      # Persists XDG_CONFIG_HOME (woven setup's config/secrets) across
      # `docker compose run --rm` invocations, without ever touching the
      # host's real ~/.config/woven. Reset manually with
      # `docker compose down -v` or `docker volume rm woven-sandbox-config`.
      - woven-sandbox-config:/home/sandbox/.config
      # Uncomment to give the container access to real provider API keys
      # for manual verification (e.g. `gemini_repl.py`). Opt-in only —
      # Compose has no "mount if exists", so this stays commented by default.
      # - ./devtools/.env:/app/devtools/.env:ro

volumes:
  woven-sandbox-config:
    name: woven-sandbox-config
