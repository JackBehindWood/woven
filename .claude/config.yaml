# .claude/config.yaml
# Local-only Claude Code configuration for the Woven repo.
# This file is intentionally minimal and meant to be untracked.

tool: claude-code
project: woven
repo_root: .
python_version: "3.12"
use_uv: true

# Safety: do not run heavy model tests on local dev machine.
disallowed_tasks:
  - run_llm_inference
  - run_llama_cpp
  - call_cloud_apis
  - start_mcp_servers
notes: >
  This is local tooling config only. Do not push .claude/ into the public repository.
