[project]
name = "woven"
version = "0.0.0"
description = "Woven project foundation (development tooling only)"
readme = "README.md"
requires-python = ">=3.12,<4"
dependencies = [
  "pydantic>=2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "ruff>=0.15",
  "pre-commit>=3.0"
]
cli = [
  "typer>=0.12",
  "rich>=13.7"
]

[project.scripts]
woven = "woven.client.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/woven"]

[tool.uv]
python-preference = "managed"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
