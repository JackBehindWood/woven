name: CI - lint & test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install uv and project dependencies
      run: |
        python -m pip install --upgrade pip
        pip install uv
        uv sync --extra dev --extra cli

    - name: Ruff (format/lint)
      run: |
        uv run ruff check .

    - name: Run pytest only if tests exist
      run: |
        if compgen -G "tests/test_*.py" > /dev/null; then
          uv run pytest -q
        else
          echo "No test files found, skipping pytest"
        fi
